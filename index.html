<!doctype html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Ilham's premium developer portfolio — futuristic, responsive, animated, and built with Vite, Tailwind CSS, and Vanilla JS."
    />
    <title>Ilham Portfolio</title>
    <link rel="icon" type="image/png" href="image/iconOP.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Sora:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
              display: ['Sora', 'sans-serif'],
            },
            colors: {
              primary: '#3B82F6',
              secondary: '#8B5CF6',
              accent: '#06B6D4',
              surface: '#030712',
            },
          },
        },
      };
    </script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    />
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body class="bg-surface text-white overflow-x-hidden">
    <div id="component-loading-screen"></div>
    <div id="component-cursor-glow"></div>
    <div id="component-header" class="sticky top-0 z-40"></div>

    <main>
      <div id="component-hero"></div>
      <div id="component-about"></div>
      <div id="component-skills"></div>
      <div id="component-projects"></div>
      <div id="component-experience"></div>
      <div id="component-certificates"></div>
      <div id="component-contact"></div>
    </main>

    <div id="component-footer"></div>
    <div id="component-modals"></div>

    <script type="module" src="./src/main.js"></script>
  </body>
</html>
