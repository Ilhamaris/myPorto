<!-- Contact Section -->
<section id="contact" class="mx-auto max-w-7xl px-4 py-24 sm:px-6 lg:px-8">
  <div class="grid gap-6 lg:grid-cols-2">
    <div class="glass-card rounded-[30px] p-6 reveal">
      <h2 class="text-3xl font-bold">Let's Connect</h2>
      <div class="mt-6 space-y-4 text-slate-300">
        <div class="flex items-center gap-3"><i class="fa-solid fa-envelope text-primary"></i> ilhamputraaris22@gmail.com</div>
        <div class="flex items-center gap-3"><i class="fa-brands fa-github text-primary"></i> github.com/Ilhamaris</div>
        <div class="flex items-center gap-3"><i class="fa-brands fa-linkedin text-primary"></i> linkedin.com/in/ilhamaris</div>
        <div class="flex items-center gap-3"><i class="fa-brands fa-instagram text-primary"></i> @ilhamptr.a</div>
      </div>
    </div>
    <form id="contactForm" class="glass-card rounded-[30px] p-6 reveal">
      <div class="grid gap-4">
        <input type="text" name="name" placeholder="Your Name" class="input-field" required />
        <input type="email" name="email" placeholder="Your Email" class="input-field" required />
        <textarea name="message" rows="5" placeholder="Tell me about your project" class="input-field" required></textarea>
        <button type="submit" class="rounded-full bg-gradient-to-r from-primary to-secondary px-6 py-3 font-semibold text-white">Send Message</button>
        <p id="formMessage" class="hidden text-sm text-emerald-300">Message sent successfully.</p>
      </div>
    </form>
  </div>
</section>
